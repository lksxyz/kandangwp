[package]
name = "kandang"
version = "0.1.2"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
ksni = { version = "0.3.7", features = ["blocking"] }
libc = "0.2.191"
mime_guess = "2.0.5"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.5.0"
url = "2.5.8"
zip = { version = "9", default-features = false, features = ["deflate"] }
